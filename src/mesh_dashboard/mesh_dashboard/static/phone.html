<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send a photo to the rover</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf7; margin: 0; padding: 24px; text-align: center; }
  h1 { font-size: 22px; } p { color: #9fb0c8; }
  label { display: block; margin: 28px auto; padding: 22px; max-width: 320px; border-radius: 14px;
          background: #1b6ef3; color: #fff; font-size: 20px; font-weight: bold; }
  input { display: none; } #msg { font-size: 18px; min-height: 28px; }
</style></head><body>
<h1>Mars rover relay mesh</h1>
<p>Take a picture. It travels from the rover, hop by hop over the drone relays, to mission control.</p>
<label>Take a photo<input id="pic" type="file" accept="image/*" capture="environment"></label>
<div id="msg"></div>
<script>
document.getElementById("pic").onchange = async (ev) => {
  const f = ev.target.files[0], msg = document.getElementById("msg");
  if (!f) return;
  msg.textContent = "Sending to the rover...";
  try {
    const r = await fetch("/upload", { method: "POST", headers: { "Content-Type": f.type || "image/jpeg" }, body: f });
    msg.textContent = r.ok ? "Sent! Watch the big screen." : "Could not send (" + (await r.text()) + ")";
  } catch (e) { msg.textContent = "No connection to the rover."; }
  ev.target.value = "";
};
</script></body></html>
